name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron: "0 3 * * 6"
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason"
        required: false
        default: "Manual trigger"

jobs:
  Python:
    uses: inveniosoftware/workflows/.github/workflows/tests-python.yml@master
    with:
      # The default matrix starts at 3.9, below this package's requires-python.
      python-version: '["3.10", "3.12", "3.14"]'
      # tika because --doctest-modules imports every module, the tika processor included.
      extras: "tests,tika"
      # Nothing here talks to a database or a search engine.
      db-service: '[""]'
      search-service: '[""]'
